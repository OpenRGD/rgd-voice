name: Voice candidate offline tests
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install FFmpeg for voice FX integration tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
      - name: Offline Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Syntax and scope
        run: |
          python -m compileall -q rgd_voice_lab
          python -m json.tool contracts/voice-lifecycle.v0.1.schema.json > /dev/null
          python -m json.tool module.candidate.json > /dev/null
