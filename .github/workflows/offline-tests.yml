name: Voice candidate offline tests
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Offline Python unit tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser JavaScript syntax
        run: node --check rgd_voice_lab/static/app.js
      - name: Syntax and scope
        run: |
          python -m compileall -q rgd_voice_lab
          python -m json.tool contracts/voice-lifecycle.v0.1.schema.json > /dev/null
          python -m json.tool module.candidate.json > /dev/null
